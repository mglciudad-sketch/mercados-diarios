name: Mercados diarios

on:
  schedule:
    # Hora UTC. Un intento cada media hora de 07:02 a 12:02 de Madrid en invierno (UTC+1);
    # en verano (UTC+2) llega hasta las 13:02. Los intentos antes de las 07:00 de Madrid se descartan.
    # Minutos 02 y 32 para evitar la congestión de GitHub a las horas en punto.
    - cron: '2,32 5-10 * * 1-5'
    - cron: '2 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mercados-diarios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Programado: solo desde las 07:00 de Madrid y si el reporte de hoy aún no se ha enviado.
      # Antes de las 11:30 solo se envía con todos los datos completos; después, con lo que haya y avisos.
      # Lanzado a mano: se envía siempre.
      - name: Decidir si toca enviar
        id: hora
        run: |
          HOY=$(TZ=Europe/Madrid date +%F)
          HM=$((10#$(TZ=Europe/Madrid date +%H%M)))
          SEGUIR=si; EXIGIR=no; ULTIMO=si
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$HM" -lt 700 ]; then SEGUIR=no; echo "Aún no son las 07:00 en Madrid"; fi
            if [ -f "archivo/mercados/$HOY.md" ]; then SEGUIR=no; echo "El reporte de hoy ya se envió"; fi
            if [ "$HM" -lt 1130 ]; then EXIGIR=si; ULTIMO=no; fi
          fi
          echo "Madrid: $(TZ=Europe/Madrid date) -> seguir=$SEGUIR exigir_completo=$EXIGIR ultimo_intento=$ULTIMO"
          { echo "seguir=$SEGUIR"; echo "exigir=$EXIGIR"; echo "ultimo=$ULTIMO"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.seguir == 'si'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-mercados.txt

      - name: Instalar dependencias
        if: steps.hora.outputs.seguir == 'si'
        run: pip install -r scripts/requirements-mercados.txt

      - name: Reporte diario y email
        id: reporte
        if: steps.hora.outputs.seguir == 'si'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          PANEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          OPCION=""
          if [ "${{ steps.hora.outputs.exigir }}" = "si" ]; then OPCION="--exigir-completo"; fi
          set +e
          python scripts/reporte_mercados.py $OPCION
          RC=$?
          set -e
          if [ $RC -eq 3 ]; then
            echo "listo=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Faltan datos; no se envía y se reintenta en el siguiente intento"
            exit 0
          fi
          echo "listo=si" >> "$GITHUB_OUTPUT"
          exit $RC

      # Los pasos siguientes se ejecutan aunque falle el email, para que el panel se actualice igual.
      - name: Generar panel web
        if: ${{ !cancelled() && steps.hora.outputs.seguir == 'si' && steps.reporte.outputs.listo != 'no' }}
        run: python scripts/panel_mercados.py

      - name: Archivar histórico en el repositorio
        if: ${{ !cancelled() && steps.hora.outputs.seguir == 'si' && steps.reporte.outputs.listo != 'no' }}
        run: |
          git config user.name "mercados-diarios[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archivo/mercados scripts/constituyentes.json
          if git diff --cached --quiet; then echo "Nada que archivar"; exit 0; fi
          git commit -m "Mercados $(TZ=Europe/Madrid date +%d-%m-%Y)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() && steps.hora.outputs.seguir == 'si' && steps.reporte.outputs.listo != 'no' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && steps.hora.outputs.seguir == 'si' && steps.reporte.outputs.listo != 'no' }}
        with:
          path: docs

      - name: Publicar panel
        id: publicar
        if: ${{ !cancelled() && steps.hora.outputs.seguir == 'si' && steps.reporte.outputs.listo != 'no' }}
        uses: actions/deploy-pages@v4

      # Solo avisa en los últimos intentos (o al lanzarlo a mano), para no llenar el correo
      # si los primeros fallan y un reintento posterior lo arregla.
      - name: Avisar por email si algo ha fallado
        if: failure() && steps.hora.outputs.seguir == 'si' && steps.hora.outputs.ultimo == 'si'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Mercados Diarios <onboarding@resend.dev>\",\"to\":[\"$EMAIL_DESTINATARIO\"],\"subject\":\"Mercados diarios: fallo $(TZ=Europe/Madrid date +%d/%m/%Y)\",\"html\":\"<p>La actualización de hoy no se ha completado. Detalle: <a href='$RUN_URL'>$RUN_URL</a></p>\"}"
